
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="/css/style.css"/><title>Mall - RyanX</title></head>
<body><div class="nav"><a href="/">←</a><b>Mall Outfit</b><span id="xp"></span></div><div class="container"><div id="items" class="grid grid-3"></div></div>
<script type="module">import {api} from '/js/api.js'; async function load(){const me=await api('/me'); document.getElementById('xp').innerText=me.xpoin+' XP'; const items=await api('/shop'); const root=document.getElementById('items'); root.innerHTML=''; items.forEach(it=>{const d=document.createElement('div'); d.className='card'; d.innerHTML='<h3>'+it.name+'</h3><span class=badge>'+it.category+' | '+it.rarity+'</span><p>'+it.description+'</p><p>Harga: '+it.price+' XP</p><button class=btn>Beli</button>'; d.querySelector('button').onclick=async()=>{try{const r=await api('/shop/buy',{method:'POST', body:JSON.stringify({item_id:it.id})}); alert('Berhasil! XP sisa '+r.xpoin); load()}catch(e){alert(e.message)}}; root.appendChild(d)})} load();</script></body></html>
