
<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="/css/style.css"/><title>Snake - RyanX</title></head>
<body><div class="nav"><a href="/">←</a><b>Snake Tikus</b><span id="xp"></span> <span id="cd"></span></div>
<div class="container"><div class="card" style="text-align:center">
<canvas id="c" width="400" height="400"></canvas>
<p>Makan tikus dapat XP! Cooldown <span id="cooldownInfo">120s</span> setelah mati anti-spam.</p>
<button class="btn" id="restart">Restart (jika cooldown selesai)</button>
<div id="msg"></div>
</div></div>
<script type="module">
import {api} from '/js/api.js';
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let snake=[{x:10,y:10}], dir={x:1,y:0}, food={x:15,y:15}, score=0, loop, canPlay=true, cooldown=120;
async function init(){
  const me=await api('/me'); document.getElementById('xp').innerText=me.xpoin+' XP';
  const cfg=await api('/config'); cooldown=cfg.snake_cooldown_sec; document.getElementById('cooldownInfo').innerText=cooldown+'s';
  // cek cooldown dari server
  const status=await api('/game/snake/status'); if(!status.canPlay){canPlay=false; startCooldown(status.remaining)} else {canPlay=true; startGame()}
}
function startGame(){if(!canPlay)return; snake=[{x:10,y:10}]; dir={x:1,y:0}; score=0; food=randFood(); clearInterval(loop); loop=setInterval(tick,120)}
function randFood(){return {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)}}
function tick(){
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x==head.x&&s.y==head.y)){ gameOver(); return}
  snake.unshift(head);
  if(head.x==food.x&&head.y==food.y){ score++; // kasih XP via backend per tikus
    api('/game/snake/eat',{method:'POST'}).then(r=>{document.getElementById('xp').innerText=r.xpoin+' XP'});
    food=randFood();
  } else snake.pop();
  draw();
}
function draw(){ctx.fillStyle='#0b1020';ctx.fillRect(0,0,400,400);ctx.fillStyle='#ff5555';ctx.fillRect(food.x*20,food.y*20,18,18);ctx.fillStyle='#6c5ce7';snake.forEach(s=>ctx.fillRect(s.x*20,s.y*20,18,18))}
function gameOver(){clearInterval(loop); api('/game/snake/over',{method:'POST', body:JSON.stringify({score})}); canPlay=false; startCooldown(cooldown); document.getElementById('msg').innerText='Mati! Cooldown dimulai';}
function startCooldown(sec){let s=sec; const iv=setInterval(()=>{document.getElementById('cd').innerText='Cooldown: '+s+'s'; s--; if(s<0){clearInterval(iv); document.getElementById('cd').innerText='Pulih!'; canPlay=true;}},1000)}
window.addEventListener('keydown',e=>{if(e.key=='ArrowUp'&&dir.y==0)dir={x:0,y:-1}; if(e.key=='ArrowDown'&&dir.y==0)dir={x:0,y:1}; if(e.key=='ArrowLeft'&&dir.x==0)dir={x:-1,y:0}; if(e.key=='ArrowRight'&&dir.x==0)dir={x:1,y:0};});
document.getElementById('restart').onclick=()=>{if(canPlay)startGame(); else alert('Masih cooldown!');}
init();
</script></body></html>
