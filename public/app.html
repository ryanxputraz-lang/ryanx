<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RyanX - Beranda</title>
<style>
  *{box-sizing:border-box;font-family:system-ui} body{margin:0;background:#08080c;color:#fff}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#12121a;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}
  .coin{background:#1f1f2e;padding:6px 12px;border-radius:20px;font-weight:700}
  nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
  .menu{background:#15151f;border:1px solid #23233a;border-radius:16px;padding:18px;text-align:center;cursor:pointer}
  .menu h3{margin:6px 0 0}
  #view{padding:16px}
  .card{background:#15151f;border:1px solid #23233a;border-radius:16px;padding:14px;margin-bottom:12px}
  input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid #2a2a45;background:#0f0f18;color:#fff;margin:6px 0}
  button{padding:10px 14px;border-radius:10px;border:0;background:#6c5cff;color:#fff;font-weight:700;cursor:pointer}
  .leader{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222}
  .shop-item{display:flex;justify-content:space-between;align-items:center}
  canvas{background:#0f0f18;border-radius:12px}
</style>
</head>
<body>
<header>
  <div><b id="uName">Player</b> <span style="opacity:.6" id="uId"></span></div>
  <div class="coin">🪙 <span id="rxc">0</span> RXC</div>
</header>

<nav>
  <div class="menu" onclick="openTab('bermain')"><div>🎮</div><h3>Bermain</h3></div>
  <div class="menu" onclick="openTab('leaderboard')"><div>🏆</div><h3>Leaderboard</h3></div>
  <div class="menu" onclick="openTab('forum')"><div>💬</div><h3>Forum</h3></div>
  <div class="menu" onclick="openTab('shop')"><div>🛍️</div><h3>Shop Hias</h3></div>
  <div class="menu" onclick="openTab('akun')"><div>⚙️</div><h3>Akun</h3></div>
  <div class="menu" onclick="openTab('admin')" id="adminMenu" style="display:none"><div>👑</div><h3>Admin</h3></div>
  <div class="menu" onclick="openTab('inbox')"><div>📥</div><h3>Inbox</h3></div>
  <div class="menu" onclick="logout()"><div>🚪</div><h3>Logout</h3></div>
</nav>

<div id="view"></div>

<script>
let user = JSON.parse(localStorage.getItem('ryanx_user')||'null');
let token = localStorage.getItem('ryanx_token');
if(!user||!token) location.href='/';
document.getElementById('uName').textContent=user.username;
document.getElementById('uId').textContent='#'+user.id.slice(0,4);
document.getElementById('rxc').textContent=user.rxc_balance;
if(user.is_admin) document.getElementById('adminMenu').style.display='block';

function authHeader(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+token }; }

async function refreshMe(){
  const r = await fetch('/api/user?action=me',{headers:authHeader()});
  const j = await r.json();
  if(j.user){ user=j.user; localStorage.setItem('ryanx_user',JSON.stringify(user)); document.getElementById('rxc').textContent=user.rxc_balance; }
}

function openTab(t){
  const v = document.getElementById('view');
  if(t==='bermain'){
    v.innerHTML = `
      <div class="card"><h3>🎮 Arena Hiburan RXC (No Real Money)</h3><p style="opacity:.7">Semua game pakai RXC hiburan. Koin tidak bisa diuangkan.</p></div>
      <div class="card"><b>BlekJek 21</b> - Kalahkan dealer mendekati 21.<br><button onclick="playGame('blekjek')">Main (10 RXC)</button> <span id="res-blekjek"></span></div>
      <div class="card"><b>Roda Gembira</b> - Putar roda keberuntungan.<br><button onclick="playGame('roda')">Putar (5 RXC)</button> <span id="res-roda"></span></div>
      <div class="card"><b>Bandar Q Duel</b> - Duel kartu vs dealer.<br><button onclick="playGame('bandarq')">Duel (15 RXC)</button> <span id="res-bandarq"></span></div>
      <div class="card"><b>Ular RXC</b> - Tanpa judi, lambat tapi aman.<br><canvas id="snake" width="300" height="300"></canvas><br><button onclick="startSnake()">Mulai Ular (+1 RXC per apel)</button></div>
      <div class="card"><b>Simulasi Trading</b> - Beli rendah jual tinggi (simulasi).<br><button onclick="playGame('trading')">Trading (20 RXC)</button> <span id="res-trading"></span></div>
    `;
    setTimeout(()=>initSnakePreview(),100);
  } else if(t==='leaderboard'){
    v.innerHTML='<div class="card"><h3>🏆 Leaderboard RXC</h3><div id="lb">Loading...</div></div>';
    fetch('/api/games?action=leaderboard',{headers:authHeader()}).then(r=>r.json()).then(j=>{
      document.getElementById('lb').innerHTML = j.list.map((u,i)=>`<div class="leader"><span>${i+1}. <span style="color:${u.username_color}">${u.username}</span></span><b>${u.rxc_balance} RXC</b></div>`).join('');
    });
  } else if(t==='forum'){
    v.innerHTML=`<div class="card"><h3>Forum Komunitas (10 RXC / post)</h3><textarea id="postContent" placeholder="Tulis apapun..."></textarea><button onclick="createPost()">Posting</button><div id="posts"></div></div>`;
    loadPosts();
  } else if(t==='shop'){
    v.innerHTML=`
      <div class="card"><h3>🛍️ Shop Hias</h3></div>
      <div class="card shop-item"><div>Warna Username<br><input id="shopColor" type="color" value="${user.username_color}"></div><button onclick="buyShop('color',500)">Beli 500 RXC</button></div>
      <div class="card shop-item"><div>Border Sultan<select id="shopBorder"><option value="none">None</option><option value="gold">Gold</option><option value="neon">Neon</option></select></div><button onclick="buyShop('border',1000)">Beli 1000 RXC</button></div>
      <div class="card shop-item"><div>Card BG Kaya<select id="shopBg"><option value="default">Default</option><option value="royal">Royal</option><option value="galaxy">Galaxy</option></select></div><button onclick="buyShop('bg',2500)">Beli 2500 RXC</button></div>
    `;
  } else if(t==='akun'){
    v.innerHTML=`
      <div class="card"><h3>⚙️ Pengaturan Akun</h3>
        <label>Ganti Foto Profil (URL)</label><input id="avatar" value="${user.avatar_url}">
        <button onclick="updateAvatar()">Simpan Avatar</button><hr>
        <label>Ganti Password (pakai OTP)</label>
        <input id="oldPass" type="password" placeholder="Password lama">
        <input id="newPass" type="password" placeholder="Password baru">
        <input id="emailForOtp" placeholder="Email kamu" value="${user.email}">
        <div style="display:flex;gap:6px"><input id="otpPass" placeholder="Kode OTP"><button onclick="sendOtpPass()" style="width:120px">Kirim OTP</button></div>
        <button onclick="changePassword()">Ganti Password</button>
        <hr><button onclick="requestCoin()">Minta Koin dari Admin</button>
        <hr><button onclick="sendCoinBox()">Kirim Koin ke Teman</button>
        <div id="akunMsg"></div>
      </div>`;
  } else if(t==='inbox'){
    v.innerHTML='<div class="card"><h3>📥 Inbox</h3><div id="inboxList">Loading...</div></div>';
    fetch('/api/user?action=inbox',{headers:authHeader()}).then(r=>r.json()).then(j=>{
      document.getElementById('inboxList').innerHTML = j.list.map(m=>`<div class="card" style="margin:6px 0">${m.message}<br><small>${m.created_at}</small></div>`).join('')||'Kosong';
    });
  } else if(t==='admin'){
    v.innerHTML=`
      <div class="card"><h3>👑 Admin Dashboard</h3>
        <div>Total Koin Beredar: <b id="totalCoin">...</b> RXC</div>
        <div>Total User: <b id="totalUser">...</b></div><br>
        <input id="searchUser" placeholder="Cari username">
        <button onclick="adminSearch()">Cari</button>
        <div id="adminList"></div><hr>
        <h4>Kirim Pesan Inbox</h4>
        <input id="inboxUser" placeholder="Username target / ALL">
        <textarea id="inboxMsg" placeholder="Pesan"></textarea>
        <button onclick="adminInbox()">Kirim Inbox</button>
      </div>`;
    fetch('/api/admin?action=stats',{headers:authHeader()}).then(r=>r.json()).then(j=>{ document.getElementById('totalCoin').textContent=j.totalCoins; document.getElementById('totalUser').textContent=j.totalUsers; });
  }
}

async function playGame(name){
  const res = await fetch('/api/games?action=play',{method:'POST',headers:authHeader(),body:JSON.stringify({game:name})});
  const j = await res.json();
  document.getElementById('res-'+name).textContent = j.message;
  if(j.ok) refreshMe();
}

async function createPost(){
  const content = document.getElementById('postContent').value;
  const r = await fetch('/api/user?action=create-post',{method:'POST',headers:authHeader(),body:JSON.stringify({content})});
  const j = await r.json(); alert(j.message); if(j.ok){ loadPosts(); refreshMe(); }
}
async function loadPosts(){
  const r = await fetch('/api/user?action=posts',{headers:authHeader()});
  const j = await r.json();
  const el = document.getElementById('posts');
  if(!el) return;
  el.innerHTML = j.list.map(p=>`<div class="card"><b style="color:${p.username_color}">${p.username}</b>: ${p.content}<br><small>${p.created_at}</small><br><input id="c-${p.id}" placeholder="Komentar gratis"><button onclick="commentPost('${p.id}')">Komentar</button> <button onclick="deleteComment('${p.id}')" style="background:#333">Hapus (owner)</button><div id="comments-${p.id}">${(p.comments||[]).map(c=>`${c.username}: ${c.content}`).join('<br>')}</div></div>`).join('');
}
async function commentPost(postId){
  const content = document.getElementById('c-'+postId).value;
  const r = await fetch('/api/user?action=comment',{method:'POST',headers:authHeader(),body:JSON.stringify({postId,content})});
  const j = await r.json(); alert(j.message); loadPosts();
}
async function buyShop(type,cost){
  let value='';
  if(type==='color') value=document.getElementById('shopColor').value;
  if(type==='border') value=document.getElementById('shopBorder').value;
  if(type==='bg') value=document.getElementById('shopBg').value;
  const r = await fetch('/api/user?action=buy-shop',{method:'POST',headers:authHeader(),body:JSON.stringify({type,value,cost})});
  const j = await r.json(); alert(j.message); refreshMe();
}
async function updateAvatar(){
  const url=document.getElementById('avatar').value;
  const r = await fetch('/api/user?action=update-avatar',{method:'POST',headers:authHeader(),body:JSON.stringify({avatar_url:url})});
  const j = await r.json(); alert(j.message); refreshMe();
}
async function sendOtpPass(){
  const email=document.getElementById('emailForOtp').value;
  const r = await fetch('/api/auth?action=send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const j = await r.json(); alert(j.message);
}
async function changePassword(){
  const oldPass=document.getElementById('oldPass').value;
  const newPass=document.getElementById('newPass').value;
  const code=document.getElementById('otpPass').value;
  const r = await fetch('/api/user?action=change-password',{method:'POST',headers:authHeader(),body:JSON.stringify({oldPass,newPass,code})});
  const j = await r.json(); document.getElementById('akunMsg').textContent=j.message;
}
function requestCoin(){ fetch('/api/user?action=request-coin',{method:'POST',headers:authHeader()}).then(r=>r.json()).then(j=>alert(j.message)); }
function sendCoinBox(){
  const to=prompt('Username tujuan:'); const amount=prompt('Jumlah RXC:');
  fetch('/api/user?action=send-coin',{method:'POST',headers:authHeader(),body:JSON.stringify({to,amount:parseInt(amount)})}).then(r=>r.json()).then(j=>{alert(j.message); refreshMe();});
}
function adminSearch(){
  const q=document.getElementById('searchUser').value;
  fetch(`/api/admin?action=search&q=${q}`,{headers:authHeader()}).then(r=>r.json()).then(j=>{
    document.getElementById('adminList').innerHTML=j.list.map(u=>`<div class="card">${u.username} - ${u.email} - ${u.rxc_balance} RXC <button onclick="adminEdit('${u.id}',${u.rxc_balance})">Edit Koin</button> <button onclick="adminDelete('${u.id}')">Hapus</button></div>`).join('');
  });
}
function adminEdit(id,bal){ const nb=prompt('Koin baru:',bal); fetch('/api/admin?action=update-coin',{method:'POST',headers:authHeader(),body:JSON.stringify({id,rxc_balance:parseInt(nb)})}).then(r=>r.json()).then(j=>alert(j.message)); }
function adminDelete(id){ if(confirm('Hapus user?')) fetch('/api/admin?action=delete-user',{method:'POST',headers:authHeader(),body:JSON.stringify({id})}).then(r=>r.json()).then(j=>alert(j.message)); }
function adminInbox(){ const user=document.getElementById('inboxUser').value; const msg=document.getElementById('inboxMsg').value; fetch('/api/admin?action=send-inbox',{method:'POST',headers:authHeader(),body:JSON.stringify({target:user,message:msg})}).then(r=>r.json()).then(j=>alert(j.message)); }
function logout(){ localStorage.clear(); location.href='/'; }

// Snake minimal
let snakeInterval;
function initSnakePreview(){
  const c=document.getElementById('snake'); if(!c) return;
  const ctx=c.getContext('2d'); ctx.fillStyle='#6c5cff'; ctx.fillRect(10,10,20,20);
}
function startSnake(){
  alert('Game Ular: Ini versi simpel, di file games/snake.js ada versi full. Untuk demo, kamu dapat +1 RXC per klik mulai.');
  playGame('ular');
}

openTab('bermain');
</script>
</body>
</html>
