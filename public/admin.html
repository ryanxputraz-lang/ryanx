
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="/css/style.css"/><title>Admin - RyanX</title></head>
<body><div class="nav"><b>Admin Panel - RyanX</b><a href="/admin/tax.html">Lihat Pajak</a> <a href="/">Home</a></div><div class="container">
<div class="grid">
<div class="card"><h3>Config Anti Inflasi</h3><div id="cfg"></div><button class="btn" onclick="saveCfg()">Simpan Config</button></div>
<div class="card"><h3>User Management</h3><input id="search" placeholder="Cari username"/><button class="btn" onclick="searchUser()">Cari</button><div id="users"></div></div>
<div class="card"><h3>Toko - Tambah/Edit Item</h3><form id="itemForm"><input name="id" placeholder="ID ex: other_005"/><input name="category" placeholder="headgear/outfit/other"/><input name="name" placeholder="Nama"/><input name="price" type="number" placeholder="Harga"/><input name="rarity" placeholder="common/rare/epic/legendary"/><input name="description" placeholder="Deskripsi"/><button class="btn">Simpan Item</button></form></div>
<div class="card"><h3>Info Update Terbaru</h3><textarea id="announcement" placeholder="Pengumuman untuk semua user"></textarea><button class="btn" onclick="saveAnn()">Publish</button></div>
</div></div>
<script type="module">
import {api} from '/js/api.js';
async function loadCfg(){const c=await api('/admin/config'); const root=document.getElementById('cfg'); root.innerHTML=''; for(let k in c){root.innerHTML+='<label>'+k+'<input data-key='+k+' value='+c[k]+'></label>'}} loadCfg();
window.saveCfg=async()=>{const inputs=document.querySelectorAll('[data-key]'); const obj={}; inputs.forEach(i=>obj[i.dataset.key]=i.value); await api('/admin/config',{method:'POST', body:JSON.stringify(obj)}); alert('Saved')}
window.searchUser=async()=>{const q=document.getElementById('search').value; const users=await api('/admin/users?search='+q); document.getElementById('users').innerHTML=users.map(u=>'<div>'+u.username+' - '+u.xpoin+' XP <button onclick="editUser(\''+u.id+'\')">Edit</button></div>').join('')}
window.editUser=async(id)=>{const xp=prompt('Set Xpoin baru:'); if(xp) await api('/admin/user/edit',{method:'POST', body:JSON.stringify({id, xpoin:parseInt(xp)})}); alert('Updated')}
document.getElementById('itemForm').onsubmit=async e=>{e.preventDefault(); const fd=new FormData(e.target); await api('/admin/shop/save',{method:'POST', body:JSON.stringify(Object.fromEntries(fd))}); alert('Item saved')}
window.saveAnn=async()=>{const txt=document.getElementById('announcement').value; await api('/admin/announce',{method:'POST', body:JSON.stringify({text:txt})}); alert('Published')}
</script></body></html>
