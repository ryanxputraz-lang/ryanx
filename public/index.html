<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- KUNCI: Tidak bisa di zoom di mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RyanX - Login</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  body{margin:0;background:#0a0a0f;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
  .card{width:100%;max-width:380px;background:#15151f;border:1px solid #23233a;border-radius:20px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:28px} .sub{opacity:.7;margin-bottom:20px}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2a2a45;background:#0f0f18;color:#fff;margin:8px 0;outline:none}
  button{width:100%;padding:12px;border-radius:12px;border:0;background:#6c5cff;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}
  button:disabled{opacity:.5}
  .row{display:flex;gap:8px}
  .small{font-size:12px;opacity:.7;text-align:center;margin-top:12px}
  .otp-box{display:none}
  #timer{font-size:12px;opacity:.8;margin-top:6px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>RyanX <span style="color:#6c5cff">RXC</span></h1>
  <div class="sub">Dunia kompetisi koin hiburan. Login untuk masuk.</div>

  <!-- LOGIN -->
  <div id="loginBox">
    <input id="l_user" placeholder="Username">
    <input id="l_pass" type="password" placeholder="Password">
    <button id="btnLogin">Login</button>
    <div class="small">Belum punya akun? <a href="#" id="toReg" style="color:#6c5cff">Daftar Baru</a></div>
  </div>

  <!-- REGISTER -->
  <div id="regBox" style="display:none">
    <input id="r_user" placeholder="Username (unik)">
    <input id="r_email" placeholder="Email untuk OTP">
    <input id="r_pass" type="password" placeholder="Password minimal 6">
    <div class="row">
      <input id="r_otp" placeholder="Kode OTP 6 digit" style="flex:1">
      <button id="btnSendOtp" style="width:110px">Kirim OTP</button>
    </div>
    <div id="timer"></div>
    <button id="btnRegister">Verifikasi & Daftar</button>
    <div class="small"><a href="#" id="toLogin" style="color:#6c5cff">Sudah punya akun? Login</a></div>
  </div>

  <div id="msg" class="small" style="color:#ff8a8a"></div>
</div>

<script>
const $ = s=>document.querySelector(s);
let cooldown = 0;
let cooldownInt;

function startCooldown(sec){
  cooldown = sec;
  const btn = $('#btnSendOtp');
  clearInterval(cooldownInt);
  btn.disabled = true;
  cooldownInt = setInterval(()=>{
    cooldown--;
    btn.textContent = `Tunggu ${cooldown}s`;
    $('#timer').textContent = `OTP berlaku 5 menit. Batas 5x salah.`;
    if(cooldown<=0){ clearInterval(cooldownInt); btn.disabled=false; btn.textContent='Kirim OTP'; }
  },1000);
}

$('#toReg').onclick = (e)=>{ e.preventDefault(); $('#loginBox').style.display='none'; $('#regBox').style.display='block'; };
$('#toLogin').onclick = (e)=>{ e.preventDefault(); $('#regBox').style.display='none'; $('#loginBox').style.display='block'; };

$('#btnSendOtp').onclick = async()=>{
  const email = $('#r_email').value.trim();
  if(!email) return $('#msg').textContent='Isi email dulu';
  $('#msg').textContent='Mengirim OTP...';
  const res = await fetch('/api/auth?action=send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const j = await res.json();
  $('#msg').textContent = j.message;
  if(j.ok){ startCooldown(60); }
};

$('#btnRegister').onclick = async()=>{
  const data = {username:$('#r_user').value.trim(), email:$('#r_email').value.trim(), password:$('#r_pass').value, code:$('#r_otp').value.trim()};
  if(!data.username||!data.email||!data.password||!data.code) return $('#msg').textContent='Lengkapi semua field';
  $('#msg').textContent='Memverifikasi...';
  const res = await fetch('/api/auth?action=register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const j = await res.json();
  $('#msg').textContent=j.message;
  if(j.ok){ setTimeout(()=>{ $('#regBox').style.display='none'; $('#loginBox').style.display='block'; },1000); }
};

$('#btnLogin').onclick = async()=>{
  const data = {username:$('#l_user').value.trim(), password:$('#l_pass').value};
  $('#msg').textContent='Login...';
  const res = await fetch('/api/auth?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const j = await res.json();
  $('#msg').textContent=j.message;
  if(j.ok){ localStorage.setItem('ryanx_token', j.token); localStorage.setItem('ryanx_user', JSON.stringify(j.user)); location.href='/app.html'; }
};
</script>
</div>
</body>
</html>
