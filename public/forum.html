
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="/css/style.css"/><title>Forum - RyanX</title></head>
<body><div class="nav"><a href="/">←</a><b>Forum</b><span id="xp"></span></div><div class="container">
<div class="card"><h3>Buat Topik (Biaya 2000 XP)</h3><form id="f"><input name="title" placeholder="Judul" required/><textarea name="content" placeholder="Konten..." required></textarea><input name="image_url" placeholder="URL Gambar (opsional)"/><input name="link_url" placeholder="Link (opsional)"/><button class="btn">Posting -2000 XP</button></form></div>
<div id="list" class="grid"></div></div>
<script type="module">import {api} from '/js/api.js'; async function refresh(){const me=await api('/me'); document.getElementById('xp').innerText=me.xpoin+' XP'} refresh();
async function load(){const topics=await api('/forum'); const root=document.getElementById('list'); root.innerHTML=''; topics.forEach(t=>{const d=document.createElement('div'); d.className='card'; d.innerHTML='<h3>'+t.title+'</h3><p>by '+t.username+'</p><p>'+t.content+'</p>'+(t.image_url?'<img src='+t.image_url+' style=max-width:100%/>':'')+'<p><a href='+t.link_url+' target=_blank>'+t.link_url+'</a></p>'; root.appendChild(d)})} load();
document.getElementById('f').onsubmit=async e=>{e.preventDefault(); const fd=new FormData(e.target); try{await api('/forum/create',{method:'POST', body:JSON.stringify(Object.fromEntries(fd))}); alert('Topik dibuat!'); load(); refresh()}catch(err){alert(err.message)}}
</script></body></html>
