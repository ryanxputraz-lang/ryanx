
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="/css/style.css"/><title>Dadu - RyanX</title></head>
<body><div class="nav"><a href="/">←</a><b>Dadu</b><span id="xp"></span></div>
<div class="container"><div class="card">
<h2>🎲 Dadu - Besar Kecil</h2>
<label>Bet: <input id="bet" type="number" value="50"/></label>
<select id="type"><option value="besar">Besar (4-6)</option><option value="kecil">Kecil (1-3)</option><option value="angka">Tebak Angka 1-6</option><option value="ganjil">Ganjil</option><option value="genap">Genap</option></select>
<input id="val" placeholder="Jika tebak angka isi 1-6"/>
<button class="btn" id="roll">Kocok Dadu</button>
<div id="dice" style="font-size:64px;margin:20px">🎲</div><div id="res"></div>
</div></div>
<script type="module">
import {api} from '/js/api.js';
async function refresh(){const me=await api('/me'); document.getElementById('xp').innerText=me.xpoin+' XP'} refresh();
document.getElementById('roll').onclick=async()=>{
  const bet=parseInt(document.getElementById('bet').value), type=document.getElementById('type').value, val=document.getElementById('val').value;
  try{const r=await api('/game/dice',{method:'POST', body:JSON.stringify({bet, bet_type:type, bet_value:val})}); document.getElementById('dice').innerText='🎲 '+r.dice; document.getElementById('res').innerText=r.win>0?'MENANG +'+r.win:'KALAH -'+bet+' | Pajak '+r.tax; document.getElementById('xp').innerText=r.xpoin+' XP'}catch(e){alert(e.message)}
}
</script></body></html>
