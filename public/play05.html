
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="/css/style.css"/><title>Trading CFD - RyanX</title></head>
<body><div class="nav"><a href="/">←</a><b>CFD Xpoin Trading</b><span id="xp"></span></div>
<div class="container"><div class="card">
<div style="display:flex;gap:8px"><button class="btn" onclick="tf='1m';load()">1 Menit</button><button class="btn" onclick="tf='5m';load()">5 Menit</button></div>
<canvas id="chart" width="800" height="300"></canvas>
<div><input id="amount" type="number" value="100" placeholder="Jumlah XP"/><button class="btn" onclick="trade('long')">LONG ↑</button><button class="btn" style="background:#e74c3c" onclick="trade('short')">SHORT ↓</button></div>
<div id="pos"></div>
</div></div>
<script type="module">
import {api} from '/js/api.js';
let tf='1m', candles=[];
async function load(){const data=await api('/trade/candles?tf='+tf); candles=data.candles; draw(); document.getElementById('xp').innerText=data.xpoin+' XP'} 
function draw(){const c=document.getElementById('chart'), ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); if(!candles.length)return; const min=Math.min(...candles.map(x=>x.low)), max=Math.max(...candles.map(x=>x.high)); const scale=(v)=>(max-min? (1-(v-min)/(max-min))*260+20:150); candles.forEach((k,i)=>{const x=i*12+10; ctx.fillStyle=k.close>=k.open?'#00ff88':'#ff5555'; ctx.fillRect(x, Math.min(scale(k.open),scale(k.close)), 6, Math.abs(scale(k.open)-scale(k.close))||2); ctx.fillRect(x+2, scale(k.high),2, scale(k.low)-scale(k.high))})}
async function trade(dir){const amt=parseInt(document.getElementById('amount').value); try{const r=await api('/trade/open',{method:'POST', body:JSON.stringify({dir, amount:amt, tf})}); document.getElementById('pos').innerText='Posisi '+dir+' '+amt+' entry '+r.entry} catch(e){alert(e.message)}}
window.load=load; window.trade=trade; load(); setInterval(load,5000);
</script></body></html>
