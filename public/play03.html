
<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="/css/style.css"/><title>Lobby - RyanX</title></head>
<body><div class="nav"><a href="/">←</a><b>Lobby Outfit</b><select id="roomSel"><option value="room1">Room1</option><option value="room2">Room2</option><option value="room3">Room3</option></select><span id="count"></span></div>
<div class="container"><div class="lobby" id="lobby"></div>
<div class="card" style="margin-top:12px"><div id="chat" style="height:150px;overflow:auto;border:1px solid #222;padding:8px"></div><input id="chatIn" placeholder="Chat umum..."/><button class="btn" id="send">Kirim</button></div></div>
<script type="module">
import {api} from '/js/api.js';
let me, room='room1', wsPos={x:100,y:100};
async function init(){me=await api('/me'); join(room); setInterval(poll,1500); renderMe()}
async function join(r){room=r; await api('/lobby/join',{method:'POST', body:JSON.stringify({room_id:r, x:wsPos.x, y:wsPos.y})})}
async function poll(){
  const data=await api('/lobby/state?room_id='+room);
  document.getElementById('count').innerText=data.users.length+' / '+data.max;
  const lobby=document.getElementById('lobby'); lobby.innerHTML='';
  data.users.forEach(u=>{const el=document.createElement('div'); el.className='avatar'; el.style.left=u.x+'px'; el.style.top=u.y+'px'; el.style.background=(u.status=='offline'?'#444':'#6c5ce7'); el.innerText=u.username[0]; el.title=u.username+' '+u.outfit+' '+(u.status=='offline'?'OFFLINE':''); lobby.appendChild(el)})
  document.getElementById('chat').innerHTML=data.chats.map(c=>'<div><b>'+c.username+':</b> '+c.msg+'</div>').join(''); 
  // auto pindah jika penuh
  if(data.users.length>=data.max){ // cari room kosong
    const next = ['room1','room2','room3'].find(r=>r!=room);
    if(next){room=next; document.getElementById('roomSel').value=room; join(room)}
  }
}
function renderMe(){const lobby=document.getElementById('lobby'); lobby.addEventListener('click',e=>{const rect=lobby.getBoundingClientRect(); wsPos={x:e.clientX-rect.left-20, y:e.clientY-rect.top-20}; api('/lobby/move',{method:'POST', body:JSON.stringify({room_id:room, x:wsPos.x, y:wsPos.y})})})}
document.getElementById('roomSel').onchange=e=>{room=e.target.value; join(room)}
document.getElementById('send').onclick=async()=>{const msg=document.getElementById('chatIn').value; if(!msg)return; await api('/lobby/chat',{method:'POST', body:JSON.stringify({room_id:room, msg})}); document.getElementById('chatIn').value=''}
init();
</script></body></html>
