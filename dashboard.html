<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard - ryanx.my.id</title><link rel="stylesheet" href="/css/style.css"/></head>
<body>
<div class="container"><div class="card">
<h1>Hi, User!</h1><p class="sub">Kamu berhasil login ke ryanx.my.id</p>
<p style="font-size:14px; margin:16px 0">Role kamu: <span class="badge user" id="role">user</span></p>
<button onclick="logout()">Logout</button>
<div class="link"><a href="/admin.html">Ke Admin (jika admin)</a></div>
</div></div>
<script src="/js/script.js"></script>
<script>
(async()=>{
  try{
    const res = await fetch('/api/me'); const d = await res.json();
    if(!res.ok) location.href='/index.html';
    document.getElementById('role').textContent = d.role;
    document.getElementById('role').className = 'badge '+d.role;
  }catch{ location.href='/index.html' }
})();
</script>
</body></html>
