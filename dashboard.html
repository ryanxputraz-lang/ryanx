<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Dashboard - RyanX</title></head>
<body>
<header><h1>Dashboard</h1><button onclick="logout()">Logout</button></header>
<div class="container">
<div class="create-post"><textarea id="content" placeholder="Share analisa tradingmu..."></textarea><div class="row"><input id="pair" placeholder="Pair: XAUUSD"><input id="type" placeholder="BUY/SELL"><input id="profit" placeholder="Profit +20$"></div><button onclick="createPost()">Posting</button></div>
<div id="myfeed"></div>
</div>
<script>
const token=localStorage.getItem('token'); if(!token) location.href='/login.html';
async function createPost(){ const res=await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json','Authorization':token},body:JSON.stringify({content:content.value,trade_pair:pair.value,trade_type:type.value,profit:profit.value})}); if(res.ok) location.reload(); }
async function loadMy(){ const res=await fetch('/api/posts',{headers:{'Authorization':token}}); const d=await res.json(); document.getElementById('myfeed').innerHTML=d.map(p=>`<div class="post-card"><b>${p.username}</b><p>${p.content}</p></div>`).join(''); }
function logout(){localStorage.removeItem('token');location.href='/';}
loadMy();
</script></body></html>
