<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - RyanX</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// GUARD - cek sebelum body muncul biar gak kedip kayak kemarin
(function(){
  const t = localStorage.getItem('ryanx_token');
  if(!t){
    location.replace('/login.html');
  }
})();
document.documentElement.style.visibility = 'hidden';
</script>
</head>
<body class="bg-[#07080b] text-white min-h-screen">
<header class="h-[64px] flex items-center justify-between px-6 border-b border-white/10 bg-black/50">
  <div class="flex items-center gap-2">
    <div class="w-8 h-8 bg-yellow-400 rounded-lg flex items-center justify-center text-black font-black">R</div>
    <b class="text-sm">RYANX.MY.ID</b>
  </div>
  <button onclick="logout()" class="text-xs bg-white text-black font-black px-4 py-2 rounded-xl">LOGOUT</button>
</header>

<main class="max-w-4xl mx-auto p-6 space-y-6">
  <div class="bg-yellow-400 text-black rounded-[24px] p-6">
    <p class="text-[11px] font-black tracking-widest opacity-60">SCALPER SQUAD TANJUNG</p>
    <h1 id="welcome" class="text-3xl font-black mt-2">Memuat...</h1>
    <p class="text-sm mt-2 opacity-80">Ini dashboard real live. Kalau kamu lihat ini berarti auth berhasil.</p>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div class="bg-white/[0.05] border border-white/10 rounded-2xl p-4">
      <p class="text-[10px] text-white/40">STATUS</p><p class="font-black">VERIFIED ✅</p>
    </div>
    <div class="bg-white/[0.05] border border-white/10 rounded-2xl p-4">
      <p class="text-[10px] text-white/40">MEMBER ID</p><p id="memberId" class="font-black">-</p>
    </div>
  </div>

  <div class="bg-white/[0.04] border border-white/10 rounded-2xl p-5">
    <h3 class="font-black text-sm">Live Scalping Room</h3>
    <p class="text-xs text-white/40 mt-1">Next session 20:00 WITA</p>
    <div id="debug" class="mt-3 p-3 bg-black rounded-xl text-xs font-mono text-white/60">Validating token...</div>
    <a href="/admin.html" id="adminLink" class="hidden mt-4 inline-block text-xs bg-red-500 text-white font-black px-4 py-2 rounded-xl">BUKA ADMIN PANEL</a>
  </div>
</main>

<script>
async function checkMe(){
  try{
    const token = localStorage.getItem('ryanx_token');
    const r = await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error);
    document.getElementById('welcome').textContent = 'Halo, ' + j.user.username + '!';
    document.getElementById('memberId').textContent = '#'+j.user.id;
    document.getElementById('debug').textContent = 'Token valid untuk: ' + j.user.email;
