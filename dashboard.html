<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - RyanX</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
(function(){
  const t = localStorage.getItem('ryanx_token');
  if(!t){ location.replace('/login.html'); }
})();
</script>
</head>
<body class="bg-[#07080b] text-white min-h-screen">
<header class="h-[64px] flex items-center justify-between px-6 border-b border-white/10">
  <div class="flex items-center gap-2"><div class="w-8 h-8 bg-yellow-400 rounded-lg flex items-center justify-center text-black font-black">R</div><b>RYANX.MY.ID</b></div>
  <button onclick="logout()" class="text-xs bg-white text-black font-black px-4 py-2 rounded-xl">LOGOUT</button>
</header>
<main class="max-w-4xl mx-auto p-6 space-y-6">
  <div class="bg-yellow-400 text-black rounded-[24px] p-6">
    <p class="text-[11px] font-black">SCALPER SQUAD TANJUNG</p>
    <h1 id="welcome" class="text-3xl font-black mt-2">Memuat akun...</h1>
  </div>
  <div class="bg-white/[0.04] border border-white/10 rounded-2xl p-5">
    <p id="debug" class="text-xs font-mono">Validating...</p>
    <a href="/admin.html" id="adminLink" class="hidden mt-4 inline-block text-xs bg-red-500 text-white font-black px-4 py-2 rounded-xl">BUKA ADMIN PANEL</a>
  </div>
</main>
<script>
async function checkMe(){
  try{
    const token = localStorage.getItem('ryanx_token');
    const r = await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
    const j = await r.json(); if(!r.ok) throw new Error(j.error);
    document.getElementById('welcome').textContent = 'Halo, ' + j.user.username + '!';
    document.getElementById('debug').textContent = 'Login sebagai: ' + j.user.email;
    if(j.user.username.toLowerCase()==='ryanx') document.getElementById('adminLink').classList.remove('hidden');
  }catch(e){ logout(); }
}
function logout(){ localStorage.clear(); location.replace('/login.html'); }
checkMe();
</script>
</body>
</html>
