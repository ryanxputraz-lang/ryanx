<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - RyanX</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// Kalau udah login, langsung lempar ke dashboard (anti flash)
if(localStorage.getItem('ryanx_token')){
  location.replace('/dashboard.html');
}
</script>
</head>
<body class="bg-[#07080b] text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[380px]">
  <div class="text-center mb-6">
    <div class="w-12 h-12 bg-yellow-400 rounded-xl mx-auto flex items-center justify-center text-black font-black">R</div>
    <h1 class="font-black text-2xl mt-3">Login <span class="text-yellow-400">Scalper Squad</span></h1>
    <p class="text-xs text-white/40">Pakai username trader kamu</p>
  </div>

  <div class="bg-white/[0.04] border border-white/10 rounded-[24px] p-5 space-y-3">
    <input id="username" placeholder="Username" autocomplete="username" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <button id="btnLogin" onclick="doLogin()" class="w-full bg-yellow-400 text-black font-black py-4 rounded-xl text-sm">MASUK DASHBOARD</button>
    <div id="msg" class="text-xs text-center text-red-400 min-h-[16px]"></div>
    <div class="text-[11px] text-center text-white/30">Belum punya akun? <a href="/register.html" class="text-yellow-400 font-bold">Daftar disini</a></div>
  </div>
</div>

<script>
async function doLogin(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnLogin');
  if(!u||!p){msg.textContent='Isi username & password'; return;}
  btn.textContent='CEK AKUN...'; btn.disabled=true; msg.textContent='';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error);
    localStorage.setItem('ryanx_token', j.token);
    localStorage.setItem('ryanx_user', JSON.stringify(j.user));
    msg.textContent='Berhasil!'; msg.className='text-xs text-center text-green-400';
    location.replace('/dashboard.html');
  }catch(err){
    msg.textContent=err.message;
    btn.textContent='MASUK DASHBOARD'; btn.disabled=false;
  }
}
</script>
</body>
</html>
