<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Scalper Squad | ryanx.my.id</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#07080b] text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[380px]">
  <div class="text-center mb-6">
    <div class="w-12 h-12 bg-yellow-400 rounded-xl mx-auto flex items-center justify-center text-black font-black text-xl">R</div>
    <h1 class="font-black text-2xl mt-3">Login <span class="text-yellow-400">Scalper Squad</span></h1>
    <p class="text-xs text-white/40">Masuk ke dashboard komunitas</p>
  </div>

  <div class="bg-white/[0.04] border border-white/10 rounded-[24px] p-5 space-y-3">
    <input id="email" type="email" placeholder="Email" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <input id="password" type="password" placeholder="Password" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <button onclick="doLogin()" id="btnLogin" class="w-full bg-yellow-400 text-black font-black py-4 rounded-xl text-sm">MASUK DASHBOARD</button>
    <div id="msg" class="text-xs text-center min-h-[16px] text-red-400"></div>
    <div class="text-[11px] text-center text-white/30">Belum punya akun? <a href="/register.html" class="text-yellow-400 font-bold">Daftar disini</a></div>
  </div>
</div>

<script>
async function doLogin(){
  const btn=document.getElementById('btnLogin'), msg=document.getElementById('msg');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  if(!email||!password){msg.textContent='Isi email & password!'; return;}
  btn.textContent='CEK AKUN...'; btn.disabled=true; msg.textContent='';
  try{
    const res = await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const j = await res.json();
    if(!res.ok) throw new Error(j.error||'Login gagal');
    
    // INI KUNCINYA BIAR GAK STUCK
    localStorage.setItem('user', JSON.stringify(j.user));
    localStorage.setItem('username', j.user.username);
    // simpan token simpel
    localStorage.setItem('token', 'logged-in-'+Date.now());

    msg.textContent='Berhasil! Masuk dashboard...'; 
    msg.className='text-xs text-center min-h-[16px] text-green-400';
    setTimeout(()=>{ window.location.replace('/dashboard.html'); }, 600);
  }catch(err){
    msg.textContent=err.message;
    btn.textContent='MASUK DASHBOARD'; btn.disabled=false;
  }
}
</script>
</body>
</html>
