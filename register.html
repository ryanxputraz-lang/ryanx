<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - ryanx.my.id</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Daftar Akun</h1>
      <p class="sub">Buat user baru untuk ryanx-db</p>
      <div id="msg" class="alert"></div>
      <form onsubmit="handleRegister(event)">
        <label>Username</label>
        <input id="username" type="text" placeholder="ryanx" required />
        <label>Email</label>
        <input id="email" type="email" placeholder="ryan@ryanz.my.id" required />
        <label>Password</label>
        <input id="password" type="password" placeholder="min 6 karakter" required />
        <label>Role</label>
        <select id="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
        <button type="submit">Daftar</button>
      </form>
      <div class="link">Sudah punya akun? <a href="/index.html">Login</a></div>
    </div>
  </div>
  <script src="/js/script.js"></script>
</body>
</html>
