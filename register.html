<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Scalper Squad - RyanX</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07080b] text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[380px]">
  <div class="text-center mb-6">
    <div class="w-12 h-12 bg-yellow-400 rounded-xl mx-auto flex items-center justify-center text-black font-black">R</div>
    <h1 class="font-black text-2xl mt-3">Join <span class="text-yellow-400">Scalper Squad</span></h1>
    <p class="text-xs text-white/40">Komunitas scalper real Tanjung</p>
  </div>

  <!-- FORM 1 DAFTAR -->
  <div id="formRegister" class="bg-white/[0.04] border border-white/10 rounded-[24px] p-5 space-y-3">
    <input id="username" placeholder="Username" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <input id="email" placeholder="Email" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <input id="password" placeholder="Password" type="password" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <button id="btnReg" onclick="doRegister()" class="w-full bg-yellow-400 text-black font-black py-4 rounded-xl">KIRIM OTP</button>
    <div id="msg1" class="text-xs text-center text-red-400 min-h-[16px]"></div>
    <p class="text-[11px] text-center text-white/30">Sudah punya akun? <a href="/login.html" class="text-yellow-400 font-bold">Login</a></p>
  </div>

  <!-- FORM 2 OTP -->
  <div id="formOtp" class="hidden bg-white/[0.04] border border-white/10 rounded-[24px] p-5">
    <h3 class="font-bold text-sm">Cek Email: <span id="emailShow" class="text-yellow-400"></span></h3>
    <p class="text-[11px] text-white/40 mt-1 mb-4">Masukkan 6 digit OTP</p>
    <input id="otp" maxlength="6" inputmode="numeric" placeholder="000000" class="w-full bg-black border border-white/10 rounded-xl px-4 py-4 text-center tracking-[10px] text-2xl font-black">
    <button id="btnOtp" onclick="doVerify()" class="mt-4 w-full bg-white text-black font-black py-4 rounded-xl">VERIFIKASI</button>
    <div id="msg2" class="text-xs text-center mt-3 text-red-400 min-h-[16px]"></div>
  </div>
</div>

<script>
let curEmail = '';
async function doRegister(){
  const u = document.getElementById('username').value.trim();
  const e = document.getElementById('email').value.trim().toLowerCase();
  const p = document.getElementById('password').value.trim();
  const msg = document.getElementById('msg1');
  const btn = document.getElementById('btnReg');
  if(!u||!e||!p){msg.textContent='Lengkapi semua'; return;}
  btn.textContent='MENGIRIM...'; btn.disabled=true; msg.textContent='';
  try{
    const r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:e,password:p})});
    const j = await r.json(); if(!r.ok) throw new Error(j.error);
    curEmail = e;
    document.getElementById('emailShow').textContent = e;
    document.getElementById('formRegister').classList.add('hidden');
    document.getElementById('formOtp').classList.remove('hidden');
  }catch(err){msg.textContent=err.message; btn.textContent='KIRIM OTP'; btn.disabled=false;}
}
