<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYANX - Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#090d16;color:#fff;font-family:Arial,sans-serif}
.container{width:100%;max-width:430px;padding:28px;background:#111827;border:1px solid #26344a;border-radius:18px;box-shadow:0 18px 55px #0008}
.logo{text-align:center;color:#e5c477;font-size:32px;font-weight:800;letter-spacing:5px}
.subtitle{text-align:center;color:#94a3b8;margin:8px 0 24px}
input{display:block;width:100%;padding:13px;margin:9px 0;border:1px solid #334155;border-radius:9px;background:#0b1220;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#d6b66b}
button{border:0;border-radius:9px;padding:13px;font-weight:700;cursor:pointer;width:100%;margin:8px 0}
.primary{background:#d6b66b;color:#111;margin-top:12px}
.secondary{background:#2563eb;color:#fff}
button:disabled{opacity:.6;cursor:wait}
.message{min-height:22px;margin-top:15px;text-align:center;color:#e5c477;font-size:14px;overflow-wrap:anywhere}
.note{text-align:center;color:#94a3b8;font-size:13px;margin-top:20px}
a{color:#e5c477;text-decoration:none}
</style>
</head>
<body>
<main class="container">
<div class="logo">RYANX</div>
<div class="subtitle">Create Your Account</div>
<form id="registerForm">
<input name="name" placeholder="Nama lengkap" maxlength="100" autocomplete="name" required>
<input name="username" placeholder="Username (3-20 karakter)" minlength="3" maxlength="20" autocomplete="username" required>
<input name="email" type="email" placeholder="Email aktif" autocomplete="email" required>
<button class="secondary" id="sendOtp" type="button">KIRIM OTP</button>
<input id="otp" placeholder="Kode OTP 6 digit" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
<button class="secondary" id="verifyOtp" type="button">VERIFIKASI EMAIL</button>
<input name="password" type="password" placeholder="Password (minimal 8 karakter)" minlength="8" maxlength="128" autocomplete="new-password" required>
<button class="primary" type="submit">BUAT AKUN</button>
</form>
<div id="message" class="message" role="status"></div>
<div class="note">Sudah punya akun? <a href="/">Login di sini</a></div>
</main>
<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const sendButton = document.getElementById("sendOtp");
const verifyButton = document.getElementById("verifyOtp");
let verifiedEmail = "";
function showMessage(text) { message.textContent = text || ""; }

sendButton.onclick = async () => {
    const email = form.elements.email.value.trim().toLowerCase();
    if (!email) return showMessage("Masukkan email terlebih dahulu.");
    sendButton.disabled = true;
    showMessage("Mengirim OTP...");
    try {
        const response = await fetch("/api/send-otp", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email})
        });
        const data = await response.json();
        if (data.success) {
            verifiedEmail = "";
            document.getElementById("otp").value = "";
        }
        showMessage(data.message || "Selesai.");
    } catch (error) {
        showMessage("Gagal menghubungi server.");
    } finally {
        sendButton.disabled = false;
    }
};

verifyButton.onclick = async () => {
    const email = form.elements.email.value.trim().toLowerCase();
    const otp = document.getElementById("otp").value.trim();
    if (!email || !/^\d{6}$/.test(otp)) return showMessage("Masukkan email dan OTP 6 digit.");
    verifyButton.disabled = true;
    showMessage("Memverifikasi OTP...");
    try {
        const response = await fetch("/api/verify-otp", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email,otp})
        });
        const data = await response.json();
        verifiedEmail = response.ok && data.success ? email : "";
        showMessage(data.message || "Verifikasi selesai.");
    } catch (error) {
        showMessage("Gagal menghubungi server.");
    } finally {
        verifyButton.disabled = false;
    }
};

form.onsubmit = async event => {
    event.preventDefault();
    const email = form.elements.email.value.trim().toLowerCase();
    if (!verifiedEmail || verifiedEmail !== email) return showMessage("Verifikasi email ini terlebih dahulu.");
    const submitButton = form.querySelector("button[type=submit]");
    submitButton.disabled = true;
    showMessage("Membuat akun...");
    const dataForm = new FormData(form);
    try {
        const response = await fetch("/api/register", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                name:dataForm.get("name"),
                username:dataForm.get("username"),
                email,
                password:dataForm.get("password")
            })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            showMessage(data.message || "Registrasi gagal.");
            return;
        }
        form.reset();
        verifiedEmail = "";
        showMessage("Registrasi berhasil. Mengalihkan ke halaman login...");
        setTimeout(() => location.href = "/", 1200);
    } catch (error) {
        showMessage("Gagal menghubungi server.");
    } finally {
        submitButton.disabled = false;
    }
};
</script>
</body>
</html>
