<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - RyanX</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
if(localStorage.getItem('ryanx_token')) location.replace('/dashboard.html');
</script>
</head>
<body class="bg-[#07080b] text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[380px]">
  <div class="text-center mb-6">
    <div class="w-12 h-12 bg-yellow-400 rounded-xl mx-auto flex items-center justify-center text-black font-black text-xl">R</div>
    <h1 class="font-black text-2xl mt-3">Daftar <span class="text-yellow-400">Scalper Squad</span></h1>
    <p class="text-xs text-white/40">Tanjung, Kalimantan Selatan</p>
  </div>

  <!-- FORM REGISTER -->
  <div id="formRegister" class="bg-white/[0.04] border border-white/10 rounded-[24px] p-5 space-y-3">
    <input id="username" placeholder="Username (contoh: ryanx)" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <input id="email" type="email" placeholder="Email aktif" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <input id="password" type="password" placeholder="Password" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-yellow-400">
    <button id="btnReg" onclick="doRegister()" class="w-full bg-yellow-400 text-black font-black py-4 rounded-xl text-sm">KIRIM OTP</button>
    <div id="msgReg" class="text-xs text-center text-red-400 min-h-[16px]"></div>
    <div class="text-[11px] text-center text-white/30">Sudah punya akun? <a href="/login.html" class="text-yellow-400 font-bold">Login</a></div>
  </div>

  <!-- FORM OTP -->
  <div id="formOtp" class="hidden bg-white/[0.04] border border-white/10 rounded-[24px] p-5 space-y-4">
    <div class="text-center">
      <p class="text-sm font-bold">Masukkan OTP</p>
      <p class="text-[11px] text-white/40 mt-1">Dikirim ke <span id="emailShow" class="text-yellow-400">-</span></p>
    </div>
    <div id="otpDebug" class="hidden bg-yellow-400 text-black rounded-xl p-3 text-center">
      <p class="text-[10px] font-black">DEBUG OTP (Email belum di-setup):</p>
      <p id="debugOtp" class="text-2xl font-black tracking-[8px]"></p>
    </div>
    <input id="otp" placeholder="123456" maxlength="6" class="w-full bg-black border border-white/10 rounded-xl px-4 py-4 text-center text-xl tracking-[8px] font-black outline-none focus:border-yellow-400">
    <button id="btnOtp" onclick="doVerify()" class="w-full bg-white text-black font-black py-4 rounded-xl text-sm">VERIFIKASI</button>
    <div id="msgOtp" class="text-xs text-center text-red-400 min-h-[16px]"></div>
    <button onclick="location.reload()" class="w-full text-[11px] text-white/30">Kirim ulang / Ganti email</button>
  </div>
</div>

<script>
let curEmail = '';
async function doRegister(){
  const u = document.getElementById('username').value.trim();
  const e = document.getElementById('email').value.trim();
  const p = document.getElementById('password').value.trim();
  const msg = document.getElementById('msgReg');
  const btn = document.getElementById('btnReg');
  if(!u||!e||!p){ msg.textContent='Lengkapi semua'; return; }
  btn.textContent='MENGIRIM...'; btn.disabled=true; msg.textContent='';
  try{
    const r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:e,password:p})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || 'Gagal daftar');
    curEmail = e;
    document.getElementById('emailShow').textContent = e;
    if(j.debug_otp){
      document.getElementById('otpDebug').classList.remove('hidden');
      document.getElementById('debugOtp').textContent = j.debug_otp;
    }
    document.getElementById('formRegister').classList.add('hidden');
    document.getElementById('formOtp').classList.remove('hidden');
  }catch(err){
    msg.textContent = err.message;
    btn.textContent='KIRIM OTP'; btn.disabled=false;
  }
}
async function doVerify(){
  const otp = document.getElementById('otp').value.trim();
  const msg = document.getElementById('msgOtp');
  const btn = document.getElementById('btnOtp');
  if(!otp){ msg.textContent='Masukkan OTP'; return; }
  btn.textContent='CEK...'; btn.disabled=true; msg.textContent='';
  try{
    const r = await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:curEmail,otp:otp})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || 'OTP salah');
    msg.textContent='Berhasil! Redirect...'; msg.className='text-xs text-center text-green-400';
    setTimeout(()=>location.href='/login.html', 1000);
  }catch(err){
    msg.textContent=err.message;
    btn.textContent='VERIFIKASI'; btn.disabled=false;
  }
}
</script>
</body>
</html>
