<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Register</title>
<style>body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f0f2f5;font-family:sans-serif}.card{background:#fff;padding:32px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:100%;max-width:380px}input{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box}button{width:100%;padding:12px;border-radius:12px;border:none;background:#000;color:#fff;cursor:pointer}</style>
</head><body>
<div class="card">
  <h2>Daftar Akun</h2>
  <input id="username" placeholder="Username" />
  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="doRegister()">Register</button>
  <button onclick="location.href='/'" style="background:#e5e7eb;color:#111;margin-top:8px">Kembali Login</button>
  <p id="msg"></p>
</div>
<script>
async function doRegister(){
  const body = {
    username: document.getElementById("username").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  };
  const res = await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data = await res.json();
  if(!res.ok){document.getElementById("msg").innerText=data.error;return;}
  alert("Berhasil daftar, silakan login");
  location.href="/";
}
</script>
</body></html>
