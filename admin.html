
<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RyanX Admin</title>
<style>body{font-family:system-ui;background:#0f172a;color:#fff;padding:20px} table{width:100%;border-collapse:collapse;margin-top:16px} th,td{padding:10px;border-bottom:1px solid #334155;text-align:left} input,button{padding:8px 10px;border-radius:8px;border:none} button{background:#38bdf8;font-weight:700;cursor:pointer} .card{background:#1e293b;padding:16px;border-radius:12px}</style>
</head><body>
<h2>Admin - Atur Chip Fun-Money</h2>
<p style="color:#94a3b8;font-size:13px">Chip ini hanya virtual untuk hiburan, bukan uang asli.</p>
<div class="card">
<button onclick="load()">Refresh Users</button> <a href="/game.html" style="color:#7dd3fc">Ke Game</a>
<table id="tbl"><thead><tr><th>Username</th><th>Chips</th><th>Admin?</th><th>Aksi</th></tr></thead><tbody></tbody></table>
</div>
<script>
let user=JSON.parse(localStorage.getItem('user')||'null'); if(!user||!user.is_admin) { alert('Bukan admin'); location.href='/'; }
async function load(){ let r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.username})}); let d=await r.json(); if(!d.ok) return alert(d.message); let tbody=document.querySelector('#tbl tbody'); tbody.innerHTML=''; d.users.forEach(u=>{ let tr=document.createElement('tr'); tr.innerHTML=`<td>${u.username}</td><td>${u.chips}</td><td>${u.is_admin? 'Ya':'Tidak'}</td><td><input id="c-${u.username}" type="number" placeholder="+/- chip" style="width:110px"><button onclick="adjust('${u.username}')">Update</button> <button onclick="setVal('${u.username}')">Set</button></td>`; tbody.appendChild(tr); }); }
async function adjust(username){ let delta=parseInt(document.getElementById('c-'+username).value||0); let r=await fetch('/api/admin/adjust',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin: user.username, target: username, delta})}); let d=await r.json(); alert(d.message); load(); }
async function setVal(username){ let val=parseInt(document.getElementById('c-'+username).value||0); let r=await fetch('/api/admin/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin: user.username, target: username, chips: val})}); let d=await r.json(); alert(d.message); load(); }
load();
</script></body></html>
