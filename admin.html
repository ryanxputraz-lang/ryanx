<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Admin Dashboard</title>
<style>body{font-family:sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;padding:32px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:100%;max-width:500px}</style>
</head><body>
<div class="card">
  <h2 id="welcome">Loading...</h2>
  <p>Email: <span id="email"></span></p>
  <p>Role: <span id="role"></span></p>
  <button onclick="doLogout()" style="padding:12px;border-radius:12px;border:none;background:#ef4444;color:#fff;width:100%;margin-top:16px">Logout</button>
</div>
<script>
// Proteksi halaman: kalau belum login, tendang ke index.html
// Kalau role tidak sesuai (misal user buka admin.html), tendang juga

async function init(){
  const token = localStorage.getItem("token");
  if(!token) { location.href="/"; return; }
  const res = await fetch("/api/me",{headers:{"Authorization":"Bearer "+token}});
  if(!res.ok){ localStorage.removeItem("token"); location.href="/"; return; }
  const data = await res.json();
  
  // LOGIKA ROLE: di admin.html ganti pengecekan ini jadi !== 'admin'
  // Untuk user.html: jika dia admin, lempar ke admin.html biar tidak nyasar
  if(data.user.role !== "admin") {
    location.href="/user.html"; return;
  }
  // Untuk admin.html nanti kamu balik: if(data.user.role !== 'admin') location.href='/user.html'

  document.getElementById("welcome").innerText = "Halo, " + data.user.username;
  document.getElementById("email").innerText = data.user.email;
  document.getElementById("role").innerText = data.user.role;
}
async function doLogout(){
  await fetch("/api/logout",{method:"POST"});
  localStorage.removeItem("token"); // Hapus token lokal
  location.href="/"; // Balik ke login, sekarang form akan muncul lagi karena token sudah hilang
}
init();
</script>
</body></html>
