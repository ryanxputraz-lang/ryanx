<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - ryanx.my.id</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>Dashboard Admin</h1>
        <p class="sub">Login sebagai <span id="adminName">...</span> · ryanx-db</p>
      </div>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h3>Table D1 - users</h3>
        <span id="count" style="font-size:12px;color:#888">Loading...</span>
      </div>

      <!-- WRAPPER BIAR GAK TEMBUS -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Created</th><th>Aksi</th></tr>
          </thead>
          <tbody id="usersBody"><tr><td colspan="6" style="text-align:center;padding:30px;color:#999">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT -->
  <div id="editModal" class="modal-bg" onclick="if(event.target==this) closeModal()">
    <div class="modal">
      <h3>Edit User</h3>
      <p>Ubah nama, email, sandi, dan role. Kosongkan sandi jika tidak mau ganti.</p>
      <div id="editMsg" class="alert"></div>
      <input type="hidden" id="editId" />
      <label>Username</label>
      <input id="editUsername" placeholder="username" />
      <label>Email</label>
      <input id="editEmail" type="email" placeholder="email@ryanx.my.id" />
      <label>Password Baru (opsional)</label>
      <input id="editPassword" type="text" placeholder="kosongkan jika tidak ganti" />
      <label>Role</label>
      <select id="editRole">
        <option value="user">user</option>
        <option value="admin">admin</option>
      </select>
      <div class="row">
        <button class="secondary" onclick="closeModal()">Batal</button>
        <button onclick="saveEdit()">Simpan</button>
      </div>
    </div>
  </div>

  <script src="./js/script.js"></script>
  <script>
    loadAdmin()
  </script>
</body>
</html>
