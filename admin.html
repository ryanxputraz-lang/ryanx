<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYANX - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d16;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 5%;background:#111827;border-bottom:1px solid #26344a;display:flex;justify-content:space-between;align-items:center}
.logo{color:#e5c477;font-size:25px;font-weight:bold;letter-spacing:3px}
button{background:#d6b66b;color:#111;border:0;padding:11px 17px;border-radius:8px;font-weight:bold;cursor:pointer}
main{max-width:900px;margin:35px auto;padding:20px}
.card{background:#111827;border:1px solid #26344a;border-radius:15px;padding:25px;margin-top:20px}
h1{color:#e5c477}.admin{color:#60a5fa;font-weight:bold}p{color:#94a3b8}
</style>
</head>
<body>
<header><div class="logo">RYANX</div><button id="logoutBtn">LOGOUT</button></header>
<main>
<h1>Admin Dashboard</h1>
<p class="admin">ADMINISTRATOR ACCESS</p>
<section class="card">
<h2>Informasi Administrator</h2>
<p>Nama: <strong id="adminName">Memuat...</strong></p>
<p>Username: <strong id="adminUsername">Memuat...</strong></p>
<p>Role: <strong class="admin">ADMIN</strong></p>
</section>
<section class="card">
<h2>Panel Admin</h2>
<p>Panel pengelolaan pengguna dan data RYANX akan dikembangkan di sini.</p>
</section>
</main>
<script>
async function loadAdmin() {
    try {
        const response = await fetch("/api/me", {credentials:"same-origin",cache:"no-store"});
        if (!response.ok) {
            location.replace("/");
            return;
        }
        const data = await response.json();
        if (!data.success || !data.user || data.user.role !== "admin") {
            location.replace(data.user && data.user.role === "user" ? "/user.html" : "/");
            return;
        }
        document.getElementById("adminName").textContent = data.user.name;
        document.getElementById("adminUsername").textContent = data.user.username;
    } catch (error) {
        document.getElementById("adminName").textContent = "Gagal memuat akun";
        document.getElementById("adminUsername").textContent = "-";
    }
}
document.getElementById("logoutBtn").onclick = async () => {
    await fetch("/api/logout", {method:"POST",credentials:"same-origin"});
    location.replace("/");
};
loadAdmin();
</script>
</body>
</html>
