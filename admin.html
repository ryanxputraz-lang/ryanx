<!DOCTYPE html><html><head><meta charset="utf-8"><title>Admin ryanx.my.id</title>
<style>body{background:#1A1A1D;color:#fff;font-family:Inter;padding:20px} .card{background:#242528;padding:15px;border-radius:12px;margin:10px 0;border-left:4px solid #D9BD7E} button{background:#D9BD7E;color:#000;padding:8px 14px;border:none;border-radius:8px;font-weight:700}</style>
</head><body>
<h2><span style="color:#6CA9E0"><</span> <span style="color:#D9BD7E">R</span> <span style="color:#6CA9E0">></span> Admin Panel</h2>
<div id="loginBox"><input id="u" placeholder="username"><input id="p" type="password" placeholder="password"><button onclick="login()">Login</button></div>
<div id="panel" style="display:none"><h3>Member Trader</h3><div id="list"></div></div>
<script>
async function login(){
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
  const j=await r.json(); if(j.error) return alert(j.error);
  if(j.user.role!=='admin' || j.user.username!=='ryanx') return alert('Bukan admin');
  localStorage.setItem('admin_token', j.token); loginBox.style.display='none'; panel.style.display='block'; load();
}
async function load(){
  const r=await fetch('/api/posts'); const data=await r.json();
  list.innerHTML=data.map(p=>`<div class=card><b>${p.username} [${p.role}]</b><p>${p.content}</p><small>${p.created_at}</small></div>`).join('');
}
</script></body></html>
