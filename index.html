<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="⚡ Builder Pro — HTML/CSS/JS Builder Full Flexible. ryanx.my.id">
<meta name="author" content="ryanx.my.id">
<meta property="og:title" content="⚡ Builder Pro — ryanx.my.id">
<meta property="og:description" content="Bangun website tanpa coding. Full flexible HTML/CSS/JS builder.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ryanx.my.id">
<title>⚡ Builder Pro — ryanx.my.id</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="logo">⚡ Builder<span>Pro</span></div>
  <div class="header-spacer"></div>
  <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">🌙</button>
  <button class="icon-btn" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
  <button class="icon-btn" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
  <button class="icon-btn primary" id="btnExport" title="Export JSON" aria-label="Export">⬇</button>
</header>

<!-- TABS (mobile) -->
<nav class="tabs">
  <button class="tab active" data-tab="input">✏️ Input</button>
  <button class="tab" data-tab="preview">👁 Preview</button>
  <button class="tab" data-tab="code">💻 Code</button>
</nav>

<!-- PANEL INPUT -->
<main class="panel active" id="panel-input">

  <div class="section">
    <div class="section-title">⚙️ Global</div>
    <div class="field">
      <label>Lang</label>
      <select id="inputLang">
        <option value="id" selected>Indonesia (id)</option>
        <option value="en">English (en)</option>
        <option value="ja">日本語 (ja)</option>
        <option value="zh">中文 (zh)</option>
        <option value="ar">العربية (ar)</option>
      </select>
    </div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="inputTitle" value="Halaman Baru">
    </div>
    <div class="field">
      <label>Meta Description</label>
      <input type="text" id="inputDesc" placeholder="Deskripsi halaman...">
    </div>
  </div>

  <div class="section">
    <div class="section-title">🎨 Custom CSS</div>
    <textarea id="inputCSS" rows="4" placeholder="body { background: #fff; }"></textarea>
  </div>

  <div class="section">
    <div class="section-title">⚡ Custom JS</div>
    <textarea id="inputJS" rows="4" placeholder="console.log('hello');"></textarea>
  </div>

  <div class="section">
    <div class="section-title">
      📦 Body Elements
      <span class="count" id="elCount">0</span>
    </div>
    <div id="elementsList"></div>
    <div class="add-bar" id="addBar"></div>
  </div>

</main>

<!-- PANEL PREVIEW -->
<main class="panel" id="panel-preview">
  <div class="preview-bar">
    <select id="previewDevice">
      <option value="100%">🖥 Full</option>
      <option value="375">📱 iPhone</option>
      <option value="768">📱 Tablet</option>
      <option value="1024">💻 Laptop</option>
    </select>
    <div class="url-bar" id="urlBar">ryanx.my.id</div>
    <button class="icon-btn" id="btnRefresh" title="Refresh" aria-label="Refresh">🔄</button>
  </div>
  <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" title="Preview"></iframe>
</main>

<!-- PANEL CODE -->
<main class="panel" id="panel-code">
  <div class="code-tabs">
    <button class="code-tab active" data-code="html">index.html</button>
    <button class="code-tab" data-code="css">style.css</button>
    <button class="code-tab" data-code="js">script.js</button>
  </div>
  <div class="code-view" id="codeView"></div>
</main>

<!-- FOOTER -->
<footer class="footer-toolbar">
  <button id="btnTemplate">📚 Template</button>
  <button id="btnImport">📥 Import</button>
  <button id="btnClear" class="danger">🗑 Clear</button>
  <button id="btnCopy" class="primary">📋 Copy</button>
</footer>

<!-- MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
