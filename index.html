<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<script>
(function(){
  'use strict';
  if (!window.React || !window.ReactDOM || !window.htm) {
    document.getElementById('root').innerHTML =
      '<div style="color:#ff9;padding:40px;text-align:center;font-family:monospace">⚠️ CDN gagal load. Cek koneksi internet atau buka dengan browser modern.</div>';
    return;
  }

  var useState = React.useState, useEffect = React.useEffect,
      useRef = React.useRef, useMemo = React.useMemo, useCallback = React.useCallback;
  var html = htm.bind(React.createElement);

  // -------- Constants --------
  var PRICE_POLL_MS = 1500;
  var DXY_POLL_MS = 30000;
  var NEWS_POLL_MS = 300000;
  var MAX_TICKS = 600;
  var MAX_CANDLES = 120;
  var MAX_CHAT_HISTORY = 6;
  var MAX_CHAT_DISPLAY = 60;
  var DEFAULT_KEYS = { twelve:'', finnhub:'', gnews:'', groq:'', gemini:'' };

  var SESSIONS = [
    { name:'SYDNEY',   openWIB:'04:00', closeWIB:'13:00', volatility:'LOW',    hoursUTC:[21,6]  },
    { name:'TOKYO',    openWIB:'06:00', closeWIB:'15:00', volatility:'MEDIUM', hoursUTC:[23,8]  },
    { name:'LONDON',   openWIB:'14:00', closeWIB:'23:00', volatility:'HIGH',   hoursUTC:[7,16]  },
    { name:'NEW YORK', openWIB:'19:00', closeWIB:'04:00', volatility:'HIGH',   hoursUTC:[12,21] }
  ];

  // -------- Helpers --------
  function f2(n, d){ d = d === undefined ? 2 : d; return Number(n).toFixed(d); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // -------- Indicators --------
  function ema(vals, period){
    if (vals.length < period) return [];
    var k = 2/(period+1), out = new Array(vals.length), sum = 0, i;
    for (i = 0; i < period; i++) sum += vals[i];
    out[period-1] = sum/period;
    for (i = period; i < vals.length; i++) out[i] = vals[i]*k + out[i-1]*(1-k);
    return out;
  }
  function rsi(vals, period){
    period = period || 14;
    if (vals.length < period + 1) return 50;
    var gain = 0, loss = 0, i, d;
    for (i = vals.length - period; i < vals.length; i++){
      d = vals[i] - vals[i-1];
      if (d > 0) gain += d; else loss -= d;
    }
    var ag = gain/period, al = (loss/period) || 1e-9;
    return 100 - 100/(1 + ag/al);
  }
  function macd(vals){
    if (vals.length < 26) return { macd:0, signal:0, hist:0 };
    var e12 = ema(vals, 12), e26 = ema(vals, 26), line = [], i;
    for (i = 0; i < vals.length; i++){
      if (e12[i] !== undefined && e26[i] !== undefined) line.push(e12[i] - e26[i]);
    }
    if (line.length < 9) return { macd: line[line.length-1] || 0, signal: 0, hist: 0 };
    var sig = ema(line, 9), m = line[line.length-1], s = sig[sig.length-1] || 0;
    return { macd:m, signal:s, hist:m - s };
  }
  function atrCalc(candles, period){
    period = period || 14;
    if (candles.length < period + 1) return 2.5;
    var trs = [], i, c, p;
    for (i = 1; i < candles.length; i++){
      c = candles[i]; p = candles[i-1];
      trs.push(Math.max(c.high - c.low, Math.abs(c.high - p.close), Math.abs(c.low - p.close)));
    }
    var sl = trs.slice(-period), s = 0;
    for (i = 0; i < sl.length; i++) s += sl[i];
    return s / sl.length;
  }
  function buildCandles(ticks){
    if (!ticks.length) return [];
    var map = new Map(), i, t, bucket;
    for (i = 0; i < ticks.length; i++){
      t = ticks[i];
      bucket = Math.floor(t.t/60000)*60000;
      if (!map.has(bucket)) map.set(bucket, []);
      map.get(bucket).push(t.price);
    }
    var arr = Array.from(map.entries()).sort(function(a,b){ return a[0]-b[0]; }).slice(-MAX_CANDLES);
    return arr.map(function(e){
      var ps = e[1];
      return { time: e[0], open: ps[0], high: Math.max.apply(null, ps), low: Math.min.apply(null, ps), close: ps[ps.length-1] };
    });
  }
  function detectSR(candles, price){
    if (candles.length < 20) return [];
    var swings = [], w = 5, i, j, c, isHigh, isLow;
    for (i = w; i < candles.length - w; i++){
      c = candles[i]; isHigh = true; isLow = true;
      for (j = i-w; j <= i+w; j++){
        if (j === i) continue;
        if (candles[j].high > c.high + 1e-4) isHigh = false;
        if (candles[j].low  < c.low  - 1e-4) isLow  = false;
        if (!isHigh && !isLow) break;
      }
      if (isHigh) swings.push({ price: c.high, type:'RESISTANCE' });
      if (isLow)  swings.push({ price: c.low,  type:'SUPPORT' });
    }
    var clusters = [], tol = 0.0025, s, near;
    for (i = 0; i < swings.length; i++){
      s = swings[i]; near = null;
      for (j = 0; j < clusters.length; j++){
        var cl = clusters[j];
        if (cl.type === s.type && Math.abs(cl.price - s.price)/s.price < tol){ near = cl; break; }
      }
      if (near){ near.price = (near.price*near.retests + s.price)/(near.retests + 1); near.retests++; }
      else clusters.push({ price: s.price, type: s.type, retests: 1 });
    }
    var out = clusters.map(function(c){
      return { price: c.price, type: c.type, retests: c.retests,
               strength: Math.min(5, c.retests),
               distance: (c.price - price)/price*100 };
    });
    out.sort(function(a,b){ return Math.abs(a.distance) - Math.abs(b.distance); });
    return out.slice(0, 6);
  }
  function computeSignal(ind, sr, dxy, price){
    var score = 0, reasons = [];

    if (ind.ema50 > ind.ema100){
      score += 20; reasons.push('EMA50 ('+f2(ind.ema50,1)+') > EMA100 ('+f2(ind.ema100,1)+') = BULLISH');
    } else {
      score -= 20; reasons.push('EMA50 ('+f2(ind.ema50,1)+') < EMA100 ('+f2(ind.ema100,1)+') = BEARISH');
    }

    if (ind.rsi < 30){ score += 25; reasons.push('RSI oversold '+f2(ind.rsi,1)+' — potensi reversal BUY'); }
    else if (ind.rsi > 70){ score -= 25; reasons.push('RSI overbought '+f2(ind.rsi,1)+' — potensi reversal SELL'); }
    else if (ind.rsi < 45){ score += 8; reasons.push('RSI '+f2(ind.rsi,1)+' di zona buy bias'); }
    else if (ind.rsi > 55){ score -= 8; reasons.push('RSI '+f2(ind.rsi,1)+' di zona sell bias'); }

    if (ind.macd > ind.macdSignal){ score += 15; reasons.push('MACD '+f2(ind.macd,2)+' > Signal = momentum bullish'); }
    else { score -= 15; reasons.push('MACD '+f2(ind.macd,2)+' < Signal = momentum bearish'); }

    var sups = sr.filter(function(s){ return s.type==='SUPPORT'; })
                 .sort(function(a,b){ return Math.abs(a.distance)-Math.abs(b.distance); });
    var ress = sr.filter(function(s){ return s.type==='RESISTANCE'; })
                 .sort(function(a,b){ return Math.abs(a.distance)-Math.abs(b.distance); });
    if (sups[0] && Math.abs(sups[0].distance) < 0.15 && sups[0].strength >= 2){
      score += 20; reasons.push('Dekat SUPPORT kuat $'+f2(sups[0].price,1)+' (retest '+sups[0].retests+'x)');
    }
    if (ress[0] && Math.abs(ress[0].distance) < 0.15 && ress[0].strength >= 2){
      score -= 20; reasons.push('Dekat RESISTANCE kuat $'+f2(ress[0].price,1)+' (retest '+ress[0].retests+'x)');
    }

    if (dxy > 104.5 && score < 0){ score -= 10; reasons.push('DXY naik ('+f2(dxy,2)+') = tekanan GOLD SELL'); }
    else if (dxy < 104.5 && score > 0){ score += 10; reasons.push('DXY turun ('+f2(dxy,2)+') = tailwind GOLD BUY'); }

    var type = 'WAIT';
    if (score >= 25) type = 'BUY';
    else if (score <= -25) type = 'SELL';

    var srSum = 0;
    for (var i = 0; i < sr.length; i++) srSum += sr[i].strength;
    var confidence = clamp(50 + Math.abs(score)*0.8 + srSum*2, 12, 92);

    var atrVal = ind.atr || 3;
    var entry = price;
    var sl = type === 'BUY' ? price - atrVal*1.5 : type === 'SELL' ? price + atrVal*1.5 : price;
    var tp = type === 'BUY' ? price + atrVal*2.5 : type === 'SELL' ? price - atrVal*2.5 : price;

    return { type: type, confidence: confidence, score: score, reasons: reasons.slice(0,4), entry: entry, sl: sl, tp: tp };
  }
  function getSessions(now){
    var utcH = now.getUTCHours() + now.getUTCMinutes()/60;
    return SESSIONS.map(function(s){
      var o = s.hoursUTC[0], c = s.hoursUTC[1], open;
      if (o < c) open = utcH >= o && utcH < c;
      else open = utcH >= o || utcH < c;
      return { name: s.name, openWIB: s.openWIB, closeWIB: s.closeWIB,
               volatility: s.volatility, hoursUTC: s.hoursUTC,
               status: open ? 'OPEN' : 'CLOSED' };
    });
  }

    return p;

  async function fetchDXY(keys){
    if (keys && keys.twelve){
      try {
        var r1 = await fetch('https://api.twelvedata.com/price?symbol=DXY&apikey=' + encodeURIComponent(keys.twelve));
        var j1 = await r1.json();
        if (j1.price && isFinite(Number(j1.price))) return Number(j1.price);
      } catch(e){}
    }
    try {
      var r2 = await fetch('https://open.er-api.com/v6/latest/USD');
      var j2 = await r2.json();
      if (j2.result === 'success' && j2.rates){
        var E = j2.rates.EUR, J = j2.rates.JPY, G = j2.rates.GBP,
            C = j2.rates.CAD, S = j2.rates.SEK, F = j2.rates.CHF;
        if (E && J && G && C && S && F){
          var dxy = 50.14348112
            * Math.pow(1/E, -0.576)
            * Math.pow(J, 0.136)
            * Math.pow(1/G, -0.119)
            * Math.pow(C, 0.091)
            * Math.pow(S, 0.042)
            * Math.pow(F, 0.036);
          if (isFinite(dxy)) return dxy;
        }
      }
    } catch(e){}
    return null;
  }

<script>
  // Make all external links open in new tab
  (function(){
    function fix(a){
      var h = a.getAttribute('href'); if (!h) return;
      try {
        var u = new URL(h, document.baseURI);
        if ((u.protocol === 'http:' || u.protocol === 'https:') && u.host !== location.host){
          a.target = '_blank'; a.rel = 'noopener noreferrer';
        }
      } catch(e){}
    }
    function scan(){ document.querySelectorAll('a[href]').forEach(fix); }
    if (document.readyState !== 'loading') scan();
    else document.addEventListener('DOMContentLoaded', scan);
    document.addEventListener('click', function(ev){
      var a = ev.target && ev.target.closest && ev.target.closest('a[href]');
      if (a) fix(a);
    }, true);
  })();
</script>
