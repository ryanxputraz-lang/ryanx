<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ryanx.my.id</title>
  <script>
    // Cek login sederhana via localStorage + validasi ke server
    (async () => {
      const token = localStorage.getItem('ryanx_token');
      if (!token) {
        location.replace('/login.html');
        return;
      }
      try {
        const res = await fetch('/api/me', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          location.replace('/dashboard.html');
        } else {
          localStorage.removeItem('ryanx_token');
          location.replace('/login.html');
        }
      } catch (e) {
        location.replace('/login.html');
      }
    })();
  </script>
  <style>body{background:#07080b;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body>
  <p>Loading ryanx.my.id...</p>
</body>
</html>
