<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>RyanX.my.id</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/all.min.css">
  <script src="js/script.js"></script>
</head>
  
<body>
  <div class="page">
    <header class="header" style="text-align: center;">
      <h1>
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-code"></i>
    <b>RyanX</b>
        <i class="fa-solid fa-gears"></i>
        <i class="fa-solid fa-dove"></i>
      </h1>
      <p class="header-description">Ruang Informasi & Catatan Pribadi</p><br>
      &lt;<a href="https://ryanx.my.id">http://RyanX.my.id/</a>&gt;
    </header>

    <main class="divcontent">
      <section class="content-card">
        <p class="card-label">SELAMAT DATANG</p>
        <h2>Registrasi :</h2>
        <p cl(ass="content-description">

<form id="registerForm" class="p-4 flex flex-col gap-3 max-w-sm mx-auto">
  <input id="username" type="text" placeholder="Username" class="p-2 rounded bg-gray-800" required />
  <input id="email" type="email" placeholder="Email" class="p-2 rounded bg-gray-800" required />
  <input id="password" type="password" placeholder="Password" class="p-2 rounded bg-gray-800" required /><br>
  <button type="submit" class="bg-cyan-400 text-black p-2 rounded font-bold">Daftar</button>
  <button type="submit" class="bg-cyan-400 text-black p-2 rounded font-bold">Login</button>
  <p id="msg" class="text-sm"></p>
</form>

<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.textContent = "Loading...";
    
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    msg.textContent = data.success ? data.message : data.error;
    if(data.success) e.target.reset();
  });
</script>     
      </p>
      </section> <!-- Menutup kartu konten -->
    </main> <!-- Menutup area konten utama -->

    <footer class="footer">
      <p>© <span id="current-year"></span> RyanX.my.id</p>
    </footer>
  </div>
</body>
</html>
