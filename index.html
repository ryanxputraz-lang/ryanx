<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RyanX Trader Community</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>RyanX</h1><div id="nav"><a href="/login.html" id="loginBtn">Login</a><a href="/dashboard.html" id="dashBtn" style="display:none">Dashboard</a></div></header>
<div class="container">
<div id="feed"></div>
</div>
<script>
const API='/api';
async function loadFeed(){
 const res=await fetch(API+'/posts');
 const posts=await res.json();
 document.getElementById('feed').innerHTML=posts.map(p=>`
  <div class="post-card">
    <div class="post-head"><b>${p.username}</b> <span>${p.trade_pair||''} ${p.trade_type||''}</span><small>${new Date(p.created_at).toLocaleString()}</small></div>
    <div class="post-body">${p.content}<br>${p.profit?`<b>P/L: ${p.profit}</b>`:''}</div>
    <div class="post-actions"><button onclick="likePost('${p.id}')">❤️ ${p.likes}</button><button onclick="commentPost('${p.id}')">💬 Komen</button></div>
    <div id="c-${p.id}"></div>
  </div>`).join('');
}
async function likePost(id){
 const token=localStorage.getItem('token'); if(!token) location.href='/login.html';
 await fetch(API+'/posts/like',{method:'POST',headers:{'Content-Type':'application/json','Authorization':token},body:JSON.stringify({post_id:id})});
 loadFeed();
}
function commentPost(id){ const t=prompt('Komentar:'); if(t) fetch(API+'/posts/comment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':token},body:JSON.stringify({post_id:id,content:t})}).then(()=>loadFeed()); }
const token=localStorage.getItem('token');
if(token){document.getElementById('loginBtn').style.display='none';document.getElementById('dashBtn').style.display='inline';}
loadFeed();
</script>
</body>
</html>
