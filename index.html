
<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RyanX - Login</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:#1e293b;padding:28px;border-radius:16px;width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none}
input{background:#0f172a;color:#fff;border:1px solid #334155}
button{background:#38bdf8;color:#000;font-weight:700;cursor:pointer}
a{color:#7dd3fc;font-size:13px}
.note{font-size:11px;color:#94a3b8;margin-top:8px}
</style>
</head><body>
<div class="card">
<h2>🎰 RyanX Blackjack</h2>
<p style="font-size:13px;color:#94a3b8">Fun Chips - Tidak bernilai uang</p>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()" style="background:#1e293b;color:#fff;border:1px solid #334155">Register</button>
<div id="msg" class="note"></div>
<p class="note">Akun admin default: ryanxputraz (setelah buat DB, edit password). Klaim harian gratis 500 chip di game.</p>
</div>
<script>
async function api(path, body){
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 return r.json();
}
async function login(){
 const res=await api('/api/login',{username:u.value,password:p.value});
 msg.textContent=res.message;
 if(res.ok){localStorage.setItem('user',JSON.stringify(res.user)); location.href='/game.html'}
}
async function register(){
 const res=await api('/api/register',{username:u.value,password:p.value});
 msg.textContent=res.message;
 if(res.ok){login()}
}
</script></body></html>
