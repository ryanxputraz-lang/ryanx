<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ryanx.my.id</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07080b] text-white flex items-center justify-center min-h-screen">
<div class="text-center">
  <div class="animate-pulse text-sm text-white/40">Checking session...</div>
</div>

<script>
(async function(){
  const token = localStorage.getItem('ryanx_token');
  const role = localStorage.getItem('ryanx_role');

  // belum login sama sekali -> ke login
  if(!token || !role){
    location.replace('/login.html');
    return;
  }

  // coba validasi token ke server biar gak pakai token palsu
  try{
    const res = await fetch('/api/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    // kalau token expired / tidak valid
    if(!res.ok) throw new Error('invalid');
    const data = await res.json();
    
    // token valid, cek role dari server (lebih aman)
    if(data.role === 'admin' || role === 'admin'){
      location.replace('/admin.html');
    } else {
      location.replace('/dashboard.html');
    }
  }catch(e){
    // kalau gagal validasi, coba pakai role lokal aja (biar gak logout terus)
    if(role === 'admin'){
      location.replace('/admin.html');
    } else if(role === 'user'){
      location.replace('/dashboard.html');
    } else {
      localStorage.clear();
      location.replace('/login.html');
    }
  }
})();
</script>
</body>
</html>
